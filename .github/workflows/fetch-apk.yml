name: Copy release APK to delivery branch (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: cand-0.1.4
      sha256:
        description: Expected sha256 of the APK
        default: 21a16f4d15151ebc1ff5f4ddd260f0ac11c6e9d5d749c7ee4ff0a5f0b5eefc00

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset and verify checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha256 }}
        run: |
          gh release download "$TAG" -p "music-app-$TAG-debug.apk" -D /tmp/apk
          echo "$SHA  /tmp/apk/music-app-$TAG-debug.apk" | sha256sum -c -
          ls -l /tmp/apk
      - name: Push APK to delivery branch (private repo; no rebuild)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "delivery-$TAG"
          git rm -rf . -q
          cp "/tmp/apk/music-app-$TAG-debug.apk" .
          git add .
          git commit -m "Delivery copy of release $TAG APK (checksum verified, not rebuilt)"
          git push -f origin "delivery-$TAG"
