name: Android CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-ci
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Record screen screenshots
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload screen screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screen-screenshots
          path: app/build/outputs/roborazzi/
          retention-days: 14

      - name: Commit screenshots back to repo
        run: |
          mkdir -p docs/screenshots
          cp app/build/outputs/roborazzi/*.png docs/screenshots/ || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git diff --cached --quiet && exit 0
          git commit -m "Update rendered screen screenshots [skip ci]"
          git push
