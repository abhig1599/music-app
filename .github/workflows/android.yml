name: Android CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-ci
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Record screen screenshots
        run: ./gradlew :app:recordRoborazziDebug --stacktrace 2>&1 | tee -a /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Upload debug APK
        continue-on-error: true # artifact storage quota can be full; the APK is published from the local file on cand-* tags
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload screen screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screen-screenshots
          path: app/build/outputs/roborazzi/
          retention-days: 14

      - name: Commit screenshots back to repo
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p docs/screenshots
          cp app/build/outputs/roborazzi/*.png docs/screenshots/ || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git diff --cached --quiet && exit 0
          git commit -m "Update rendered screen screenshots [skip ci]"
          git push

      - name: Commit compile/test errors back to repo on failure
        if: ${{ failure() && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p docs
          grep -E "^e: |error:|FAILED|What went wrong|Caused by|Exception|Error|expected" /tmp/build.log | head -60 > docs/ci-last-failure.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci-last-failure.txt
          git commit -m "CI failure log [skip ci]" || exit 0
          git push

      - name: Publish private pre-release with the APK (cand-* tags only)
        if: startsWith(github.ref, 'refs/tags/cand-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "music-app-${GITHUB_REF_NAME}-debug.apk"
          gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME (experimental debug build)" \
            --notes "Debug APK built by CI from commit ${GITHUB_SHA}. Private repo release. Experimental: CI ran unit tests and Robolectric render tests only. No emulator or physical-device test, so hardware behaviour (playback, seeking, audio output, scan) is unverified. Known limits are in DECISIONS.md." \
            "music-app-${GITHUB_REF_NAME}-debug.apk"
