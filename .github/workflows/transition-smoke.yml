name: Transition smoke (manual, one-shot)

on:
  workflow_dispatch:

concurrency:
  group: transition-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest   # standard 2-core Linux, $0.006/min list rate; paid overage blocked by $0 Actions budget
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PpcmTap=true --stacktrace   # PCM tap exists only in smoke builds, never in candidates
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Transition smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/ci/transition-smoke.sh
      - name: Upload transition evidence
        if: always()
        continue-on-error: true # artifact storage quota can be full; verdict is in the job log
        uses: actions/upload-artifact@v4
        with:
          name: transition-smoke-out
          path: smoke-out/
          retention-days: 14
